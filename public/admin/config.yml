backend:
  name: github
  repo: zynraaitool-sudo/AutoPet
  branch: main
  base_url: https://autopet.store
  auth_endpoint: api/auth

logo:
  src: /admin/autopet-logo.svg
  show_in_header: true

media_folder: public/images
public_folder: /images

collections:
  - name: reviews
    label: Reviews
    label_singular: Review
    folder: src/content/reviews
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    fields:
      - label: Title
        name: title
        widget: string
        hint: Keep the generated article slug short and lowercase.
      - label: Description
        name: description
        widget: text
        hint: Write a concise meta description of 150-160 characters.
      - label: Publication date
        name: date
        widget: datetime
        default: "{{now}}"
        date_format: "YYYY-MM-DD"
        time_format: false
      - label: Updated date
        name: updated
        widget: datetime
        date_format: "YYYY-MM-DD"
        time_format: false
        required: false
      - label: Category
        name: category
        widget: select
        options:
          - automatic-cat-feeders
          - pet-water-fountains
          - smart-litter-boxes
      - label: Featured image
        name: image
        widget: image
        required: false
      - label: Image alt text
        name: imageAlt
        widget: string
        required: false
      - label: Quick verdict
        name: quickVerdict
        widget: text
        required: false
      - label: Comparison title
        name: comparisonTitle
        widget: string
        required: false
        hint: Optional comparison table caption; defaults to "At a glance".
      - label: Product column label
        name: productLabel
        widget: string
        required: false
        hint: Optional label for the first comparison column; defaults to "Product".
      - label: Products
        name: products
        widget: list
        required: false
        summary: "{{fields.name}}"
        fields:
          - label: Name
            name: name
            widget: string
          - label: Price range
            name: priceRange
            widget: string
          - label: Image
            name: image
            widget: image
            required: false
          - label: Features
            name: features
            widget: list
            field:
              label: Feature
              name: feature
              widget: string
          - label: Rating
            name: rating
            widget: number
            value_type: float
            min: 0
            max: 5
            step: 0.1
            required: false
          - label: Rating note
            name: ratingNote
            widget: string
            required: false
            hint: Optional source or rating-count note shown below the buyer rating.
          - label: URL
            name: url
            widget: string
            hint: Enter a complete URL, including https://
      - label: Pros
        name: pros
        widget: list
        required: false
        field:
          label: Pro
          name: pro
          widget: string
      - label: Cons
        name: cons
        widget: list
        required: false
        field:
          label: Con
          name: con
          widget: string
      - label: Frequently asked questions
        name: faqs
        widget: list
        required: false
        fields:
          - label: Question
            name: question
            widget: string
          - label: Answer
            name: answer
            widget: text
      - label: Draft
        name: draft
        widget: boolean
        default: true
        hint: Uncheck Draft to publish this article.
      - label: Article body
        name: body
        widget: markdown
        buttons:
          - bold
          - italic
          - code
          - link
          - heading-one
          - heading-two
          - quote
          - bulleted-list
          - numbered-list
        editor_components:
          - image
          - html_block
          - affiliate_button
          - callout
          - quick_table
