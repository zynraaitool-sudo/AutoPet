backend:
  name: github
  repo: zynraaitool-sudo/AutoPet
  branch: main
  base_url: https://autopet.store
  auth_endpoint: api/auth

media_folder: public/images
public_folder: /images

collections:
  - name: reviews
    label: Reviews
    label_singular: Review
    folder: src/content/reviews
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    fields:
      - label: Title
        name: title
        widget: string
      - label: Description
        name: description
        widget: text
      - label: Publication date
        name: date
        widget: datetime
        date_format: "YYYY-MM-DD"
        time_format: false
      - label: Updated date
        name: updated
        widget: datetime
        date_format: "YYYY-MM-DD"
        time_format: false
        required: false
      - label: Category
        name: category
        widget: string
      - label: Featured image
        name: image
        widget: image
        required: false
      - label: Image alt text
        name: imageAlt
        widget: string
        required: false
      - label: Quick verdict
        name: quickVerdict
        widget: text
      - label: Products
        name: products
        widget: list
        summary: "{{fields.name}}"
        fields:
          - label: Name
            name: name
            widget: string
          - label: Price range
            name: priceRange
            widget: string
          - label: Image
            name: image
            widget: image
            required: false
          - label: Features
            name: features
            widget: list
            field:
              label: Feature
              name: feature
              widget: string
          - label: Rating
            name: rating
            widget: number
            value_type: float
            min: 0
            max: 5
            step: 0.1
          - label: URL
            name: url
            widget: string
            hint: Enter a complete URL, including https://
      - label: Pros
        name: pros
        widget: list
        field:
          label: Pro
          name: pro
          widget: string
      - label: Cons
        name: cons
        widget: list
        field:
          label: Con
          name: con
          widget: string
      - label: Frequently asked questions
        name: faqs
        widget: list
        fields:
          - label: Question
            name: question
            widget: string
          - label: Answer
            name: answer
            widget: text
      - label: Draft
        name: draft
        widget: boolean
        default: false
      - label: Article body
        name: body
        widget: markdown
        buttons:
          - bold
          - italic
          - code
          - link
          - heading-one
          - heading-two
          - quote
          - bulleted-list
          - numbered-list
          - image
