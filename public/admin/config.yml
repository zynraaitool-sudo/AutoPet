backend:
  name: github
  repo: zynraaitool-sudo/AutoPet
  branch: main
  base_url: https://autopet.store
  auth_endpoint: api/auth

logo:
  src: /admin/autopet-logo.svg
  show_in_header: true

media_folder: public/images
public_folder: /images

collections:
  - name: products
    label: Products
    label_singular: Product
    description: Manage catalog products separately from reviews and guides. New products stay drafts until Draft is unchecked.
    folder: src/content/products
    media_folder: ../../../public/images/products/{{slug}}
    public_folder: /images/products/{{slug}}
    create: true
    identifier_field: name
    summary: "{{name}} | {{category}}"
    view_filters:
      - label: Drafts
        field: draft
        pattern: true
      - label: Published
        field: draft
        pattern: false
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    fields:
      - label: Product name
        name: name
        widget: string
      - label: Category
        name: category
        widget: select
        options:
          - automatic-cat-feeders
          - pet-water-fountains
          - smart-litter-boxes
          - pet-inspired-toys
          - pet-grooming
          - dog-walking-travel
          - interactive-cat-toys
      - label: Show in curated catalog
        name: catalogVisible
        widget: boolean
        default: true
        hint: Turn off to keep a published product page without featuring it in product recommendations.
      - label: Short description
        name: description
        widget: text
      - label: Main image
        name: image
        widget: image
        required: false
      - label: Image alt text
        name: imageAlt
        widget: string
        required: false
      - label: Gallery images
        name: gallery
        widget: list
        required: false
        hint: Reorder images by dragging them in the list.
        field:
          label: Image
          name: image
          widget: image
      - label: YouTube video URL
        name: youtubeUrl
        widget: string
        required: false
      - label: Direct MP4 video URL
        name: videoUrl
        widget: string
        required: false
        hint: Use a hosted HTTPS .mp4 URL. Do not commit large video files to this repository.
      - label: Video poster image
        name: videoPoster
        widget: image
        required: false
      - label: Video title
        name: videoTitle
        widget: string
        required: false
      - label: Detailed description
        name: body
        widget: markdown
        required: true
      - label: Specifications
        name: specifications
        widget: list
        required: false
        fields:
          - label: Specification
            name: name
            widget: string
          - label: Value
            name: value
            widget: string
      - label: Features
        name: features
        widget: list
        required: false
        field:
          label: Feature
          name: feature
          widget: string
      - label: Pros
        name: pros
        widget: list
        required: false
        field:
          label: Pro
          name: pro
          widget: string
      - label: Cons
        name: cons
        widget: list
        required: false
        field:
          label: Con
          name: con
          widget: string
      - label: Price
        name: price
        widget: string
        required: false
      - label: AliExpress product URL
        name: productUrl
        widget: string
        required: false
        hint: Enter a complete product URL when no affiliate link is available.
      - label: Affiliate URL
        name: affiliateUrl
        widget: string
        required: false
        hint: If supplied, this tracked URL is used instead of the regular product URL.
      - label: Linked review slug
        name: relatedArticle
        widget: relation
        collection: reviews
        search_fields:
          - title
        value_field: "{{slug}}"
        display_fields:
          - "{{title}}"
        required: false
      - label: Display order
        name: displayOrder
        widget: number
        value_type: int
        default: 100
        hint: Lower numbers appear first.
      - label: Draft — keep unpublished
        name: draft
        widget: boolean
        default: true
        hint: Checked = unpublished. Uncheck only when the product page is ready to publish.
  - name: reviews
    label: Reviews & Guides
    label_singular: Review or Guide
    description: Manage editorial reviews and guides independently from featured products.
    folder: src/content/reviews
    create: true
    summary: "{{title}} | {{category}}"
    view_filters:
      - label: Drafts
        field: draft
        pattern: true
      - label: Draft off
        field: draft
        pattern: false
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    fields:
      - label: Title
        name: title
        widget: string
        hint: Keep the generated article slug short and lowercase.
      - label: Description
        name: description
        widget: text
        hint: Write a concise meta description of 150-160 characters.
      - label: Publication date
        name: date
        widget: datetime
        default: "{{now}}"
        date_format: "YYYY-MM-DD"
        time_format: false
      - label: Updated date
        name: updated
        widget: datetime
        date_format: "YYYY-MM-DD"
        time_format: false
        required: false
      - label: Category
        name: category
        widget: select
        options:
          - automatic-cat-feeders
          - pet-water-fountains
          - smart-litter-boxes
          - pet-grooming
          - dog-walking-travel
          - interactive-cat-toys
      - label: Article type
        name: articleType
        widget: select
        required: false
        options:
          - label: Product review
            value: product-review
          - label: Buying guide
            value: buying-guide
          - label: Product comparison
            value: comparison
          - label: Pet care guide
            value: pet-care-guide
      - label: Featured image
        name: image
        widget: image
        required: false
      - label: Image alt text
        name: imageAlt
        widget: string
        required: false
      - label: Quick verdict
        name: quickVerdict
        widget: text
        required: false
      - label: Comparison title
        name: comparisonTitle
        widget: string
        required: false
        hint: Optional comparison table caption; defaults to "At a glance".
      - label: Product column label
        name: productLabel
        widget: string
        required: false
        hint: Optional label for the first comparison column; defaults to "Product".
      - label: Products
        name: products
        widget: list
        required: false
        summary: "{{fields.name}}"
        fields:
          - label: Name
            name: name
            widget: string
          - label: Price range
            name: priceRange
            widget: string
          - label: Image
            name: image
            widget: image
            required: false
          - label: Features
            name: features
            widget: list
            field:
              label: Feature
              name: feature
              widget: string
          - label: Rating
            name: rating
            widget: number
            value_type: float
            min: 0
            max: 5
            step: 0.1
            required: false
          - label: Rating note
            name: ratingNote
            widget: string
            required: false
            hint: Optional source or rating-count note shown below the buyer rating.
          - label: URL
            name: url
            widget: string
            required: false
            hint: Enter a complete product URL, including https://
          - label: Affiliate link
            name: affiliate
            widget: boolean
            default: true
            hint: Turn off for a regular product link without referral tracking.
      - label: Pros
        name: pros
        widget: list
        required: false
        field:
          label: Pro
          name: pro
          widget: string
      - label: Cons
        name: cons
        widget: list
        required: false
        field:
          label: Con
          name: con
          widget: string
      - label: Frequently asked questions
        name: faqs
        widget: list
        required: false
        fields:
          - label: Question
            name: question
            widget: string
          - label: Answer
            name: answer
            widget: text
      - label: Draft — keep unpublished
        name: draft
        widget: boolean
        default: true
        hint: Checked = article remains unpublished. Unchecked = article is eligible for publication after saving.
      - label: Article body
        name: body
        widget: markdown
        buttons:
          - bold
          - italic
          - code
          - link
          - heading-one
          - heading-two
          - quote
          - bulleted-list
          - numbered-list
        editor_components:
          - image
          - html_block
          - affiliate_button
          - callout
          - quick_table
